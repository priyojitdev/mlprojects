
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Performance Prediction</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 700px;

            background: white;
            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;

            font-weight: bold;
            color: #333;
        }

        select,
        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 15px;
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: #555;
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;
            border-radius: 6px;

            background-color: #333;
            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        .prediction {
            margin-top: 25px;

            padding: 15px;

            background-color: #f0f0f0;

            border-radius: 6px;

            text-align: center;

            font-size: 20px;
            font-weight: bold;

            color: #222;
        }
    </style>
</head>


<body>

    <div class="container">

        <h1>Student Performance Prediction</h1>

        <p class="subtitle">
            Enter the student's details to predict the math score
        </p>


     

        <form action="{{ url_for('predict_datapoint') }}" method="POST">


      

            <div class="form-group">

                <label for="gender">
                    Gender
                </label>

                <select name="gender" id="gender" required>

                    <option value="">
                        Select Gender
                    </option>

                    <option value="male">
                        Male
                    </option>

                    <option value="female">
                        Female
                    </option>

                </select>

            </div>


            

            <div class="form-group">

                <label for="race_ethnicity">
                    Race / Ethnicity
                </label>

                <select
                    name="race_ethnicity"
                    id="race_ethnicity"
                    required>

                    <option value="">
                        Select Group
                    </option>

                    <option value="group A">
                        Group A
                    </option>

                    <option value="group B">
                        Group B
                    </option>

                    <option value="group C">
                        Group C
                    </option>

                    <option value="group D">
                        Group D
                    </option>

                    <option value="group E">
                        Group E
                    </option>

                </select>

            </div>


            

            <div class="form-group">

                <label for="parental_level_of_education">
                    Parental Level of Education
                </label>

                <select
                    name="parental_level_of_education"
                    id="parental_level_of_education"
                    required>

                    <option value="">
                        Select Education
                    </option>

                    <option value="some high school">
                        Some High School
                    </option>

                    <option value="high school">
                        High School
                    </option>

                    <option value="some college">
                        Some College
                    </option>

                    <option value="associate's degree">
                        Associate's Degree
                    </option>

                    <option value="bachelor's degree">
                        Bachelor's Degree
                    </option>

                    <option value="master's degree">
                        Master's Degree
                    </option>

                </select>

            </div>


    

            <div class="form-group">

                <label for="lunch">
                    Lunch
                </label>

                <select
                    name="lunch"
                    id="lunch"
                    required>

                    <option value="">
                        Select Lunch Type
                    </option>

                    <option value="standard">
                        Standard
                    </option>

                    <option value="free/reduced">
                        Free/Reduced
                    </option>

                </select>

            </div>




            <div class="form-group">

                <label for="test_preparation_course">
                    Test Preparation Course
                </label>

                <select
                    name="test_preparation_course"
                    id="test_preparation_course"
                    required>

                    <option value="">
                        Select Option
                    </option>

                    <option value="none">
                        None
                    </option>

                    <option value="completed">
                        Completed
                    </option>

                </select>

            </div>


        

            <div class="form-group">

                <label for="reading_score">
                    Reading Score
                </label>

                <input
                    type="number"
                    name="reading_score"
                    id="reading_score"
                    min="0"
                    max="100"
                    placeholder="Enter reading score"
                    required>

            </div>


            <!-- Writing Score -->

            <div class="form-group">

                <label for="writing_score">
                    Writing Score
                </label>

                <input
                    type="number"
                    name="writing_score"
                    id="writing_score"
                    min="0"
                    max="100"
                    placeholder="Enter writing score"
                    required>

            </div>


            <!-- Submit -->

            <button type="submit">
                Predict Math Score
            </button>

        </form>


        <!-- Prediction result -->

        {% if results is not none %}

        <div class="prediction">

            Predicted Math Score:
            {{ results }}

        </div>

        {% endif %}


    </div>

</body>

</html>
